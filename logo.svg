<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Badge -->
  <rect x="4" y="4" width="40" height="40" rx="11" fill="url(#logoGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="10.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Minimalist Code Brackets & Slash < / > -->
  <!-- Left Bracket < -->
  <path d="M19 16L13 24L19 32" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Slash / -->
  <path d="M26 15L22 33" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right Bracket > -->
  <path d="M29 16L35 24L29 32" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle Data Accent Dot -->
  <circle cx="36" cy="12" r="2" fill="#38BDF8"/>
</svg>
